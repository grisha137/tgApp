version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tg_game_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tg_game
      POSTGRES_PASSWORD: tg_game_password
      POSTGRES_DB: tg_game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tg_game_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://tg_game:tg_game_password@postgres:5432/tg_game
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
    volumes:
      - ./backend:/app
      - backend_static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tg_game_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_dist:/app/dist
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  backend_static:
  frontend_dist:
